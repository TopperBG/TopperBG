name: GitHub Profile Metrics

on:
  schedule:
    - cron: "17 2 * * *"

  workflow_dispatch:

  push:
    branches:
      - main
    paths:
      - ".github/workflows/main.yml"

permissions:
  contents: write

concurrency:
  group: github-profile-metrics
  cancel-in-progress: true

jobs:
  github-metrics:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Generate profile metrics
        uses: lowlighter/metrics@v3.34
        with:
          token: ${{ secrets.METRICS_TOKEN }}

          user: TopperBG
          filename: metrics.base.svg

          base: header, activity, community, repositories, metadata
          repositories_forks: yes

          config_timezone: Europe/Sofia

          plugin_activity: yes
          plugin_activity_limit: 8
          plugin_activity_days: 30
          plugin_activity_filter: all

          plugin_stars: yes
          plugin_stars_limit: 5
