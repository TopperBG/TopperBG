name: GitHub Metrics

on:
  schedule:
    - cron: "17 2 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  base:
    runs-on: ubuntu-latest
    steps:
      - name: Generate base metrics
        uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          user: TopperBG
          filename: metrics.base.svg
          base: header, community, repositories, metadata
          repositories_forks: yes
          config_timezone: Europe/Sofia

  activity:
    runs-on: ubuntu-latest
    steps:
      - name: Generate activity metrics
        uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          user: TopperBG
          filename: metrics.activity.svg
          base: ""
          config_timezone: Europe/Sofia

          plugin_activity: yes
          plugin_activity_limit: 8
          plugin_activity_days: 30
          plugin_activity_filter: all
